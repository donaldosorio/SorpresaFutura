<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background-color: #ffe4e6; 
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 20px;
            margin: 20px;
        }
        .polaroid {
            background: white;
            padding: 10px 10px 20px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 20px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
            animation: aparecer 1.5s ease-out;
        }
        @keyframes aparecer {
            from { 
                opacity: 0; 
                transform: translateY(20px) rotate(-2deg); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) rotate(-2deg); 
            }
        }
        .polaroid:hover { 
            transform: rotate(0deg); 
        }
        .polaroid img { 
            width: 100%; 
            height: 350px; 
            object-fit: cover; 
            border-radius: 4px; 
        }
        .names { 
            font-family: 'Sacramento', cursive; 
            font-size: 2.2rem; 
            color: #d90429; 
            margin-top: 10px; 
            min-height: 45px; 
        }
        .legend { 
            font-size: 0.9rem; 
            line-height: 1.6; 
            color: #666; 
            margin-bottom: 25px; 
            padding: 0 10px; 
            min-height: 120px; 
        }
        .question { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            color: #2b2b2b; 
            opacity: 0; 
            animation: fadeIn 1s ease-in forwards; 
            animation-delay: 6s; 
        }
        .buttons { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            position: relative; 
            height: 50px; 
            opacity: 0; 
            animation: fadeIn 1s ease-in forwards; 
            animation-delay: 6.5s; 
        }
        @keyframes fadeIn { 
            to { 
                opacity: 1; 
            } 
        }
        .btn { 
            padding: 10px 25px; 
            font-size: 1rem; 
            font-weight: 600; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .btn-yes { 
            background-color: #d90429; 
            color: white; 
            box-shadow: 0 4px 10px rgba(217, 4, 41, 0.3); 
        }
        .btn-yes:hover { 
            background-color: #b70322; 
            transform: scale(1.05); 
        }
        .btn-no { 
            background-color: #e5e5e5; 
            color: #555; 
            position: absolute; 
        }
        .titulo-carta { 
            font-family: 'Sacramento', cursive; 
            font-size: 2.8rem; 
            color: #d90429; 
            margin-bottom: 15px; 
            font-weight: normal; 
            min-height: 50px; 
        }

        /* Estilo para la foto circular de la pantalla final */
        .foto-circular {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto 20px auto;
            display: block;
            animation: aparecer 1s ease-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="titulo-carta" id="titulo-carta"></h1>
        <div class="polaroid">
            <img src="fotoBaby.jpeg" alt="Foto pareja">
            <div class="names" id="nombres-pareja"></div>
        </div>
        <p class="legend" id="texto-carta"></p>
        <div class="question">¿Quieres ser mi novia?</div>
        <div class="buttons">
            <button class="btn btn-yes" onclick="aceptar()">¡Sí, quiero!</button>
            <button class="btn btn-no" id="btnNo" onmouseover="moverBoton()" onclick="moverBoton()">No</button>
        </div>
    </div>

    <script>
        const tituloOriginal = "Querida Katy";
        const nombresOriginal = "Denki & Don";
        const cartaOriginal = "Katy, eres la niña más especial que yo he conocido. En estos tres meses que llevo el privilegio de conocerte un poquito más, quiero que sepas que cada día es más especial. Mi nena bella, nunca había estado así por alguien, y lo he pensado bien: nunca había estado tan seguro. Eres ya parte de mi vida, pero hay una cosa que aún no te he dicho.";
        
        function escribirElemento(elementoId, texto, velocidad, callback) {
            let i = 0;
            function escribir() {
                if (i < texto.length) {
                    document.getElementById(elementoId).innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(escribir, velocidad);
                } else if (callback) { 
                    callback(); 
                }
            }
            escribir();
        }

        window.onload = function() {
            escribirElemento("titulo-carta", tituloOriginal, 70, function() {
                escribirElemento("nombres-pareja", nombresOriginal, 70, function() {
                    escribirElemento("texto-carta", cartaOriginal, 40);
                });
            });
        };

        function aceptar() {
            document.body.innerHTML = `
                <div style="text-align: center; font-family: 'Poppins', sans-serif; padding: 90px; max-width: 550px; margin: 0 auto;">
                    <img src="FotoGraciosa.jpeg" class="foto-circular" alt="Nosotros">
                    <h1 id="titulo-final" style="font-family: 'Sacramento', cursive; font-size: 3rem; color: #d90429; min-height: 80px;"></h1>
                    <p id="subtitulo-final" style="font-size: 1.2rem; margin-top: 15px; color: #555;"></p>
                </div>
            `;
            escribirElemento("titulo-final", "¡Hoy comienza una aventura llena de amor! ❤️", 50, function() {
                escribirElemento("subtitulo-final", "Gracias por compartir tu vida conmigo.", 40);
            });
        }

        function moverBoton() {
            const btnNo = document.getElementById('btnNo');
            const randomX = Math.random() * 150 - 75;
            const randomY = Math.random() * 100 - 50;
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }
    </script>
</body>
</html>
